name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  python:
    name: Python (worker)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # python-dotenv is required by worker/app.py at import time. Without it the
      # HAS_APP guards in the test suite evaluate False and every HTTP-route test
      # skips silently — py_compile does not execute imports, so the compile gate
      # below would still pass while the tests never ran.
      - name: Install test dependencies
        run: pip install pytest fastapi httpx python-dotenv

      - name: Compile check (worker)
        run: python -m py_compile worker/app.py worker/nas_scan.py worker/tests/test_image_cache.py worker/tests/test_nas_scan.py

      - name: Run worker unit tests
        run: |
          cd worker
          PYTHONPATH=. python -m pytest tests/test_image_cache.py tests/test_nas_scan.py -q
