name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  db-security:
    name: DB security gate (cross-tenant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The only job that touches a real database. Everything else in this file
      # mocks Supabase, which is exactly why a policy that could not execute, a
      # nullable column whose NULL meant world-readable, two unwired role
      # vocabularies, four USING (true) anon grants and a SECURITY DEFINER RPC
      # any Viewer could call all shipped green.
      #
      # This also proves `supabase/bootstrap.sql` — the file the contract lists
      # as the buyer's turnkey deliverable, and which is gitignored and
      # therefore generated here — can be applied by a stranger with nothing but
      # this repository. It could not: migration 0033 aborted the bundle halfway.
      - name: Apply migrations and run the cross-tenant gate
        run: npm run db:gate

  python:
    name: Python (worker)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # python-dotenv is required by worker/app.py at import time. Without it the
      # HAS_APP guards in the test suite evaluate False and every HTTP-route test
      # skips silently — py_compile does not execute imports, so the compile gate
      # below would still pass while the tests never ran.
      - name: Install test dependencies
        run: pip install pytest fastapi httpx python-dotenv

      - name: Compile check (worker & station-agent)
        run: |
          python -m py_compile worker/app.py worker/nas_scan.py worker/tests/test_image_cache.py worker/tests/test_nas_scan.py
          python -m py_compile station-agent/app.py station-agent/tests/test_sync_cli.py

      - name: Run worker unit tests
        run: |
          cd worker
          PYTHONPATH=. python -m pytest tests/test_image_cache.py tests/test_nas_scan.py -q

      - name: Run station-agent unit tests
        run: |
          cd station-agent
          PYTHONPATH=. python -m pytest tests/test_sync_cli.py -q
