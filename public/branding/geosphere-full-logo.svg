<svg viewBox="0 0 820 200" width="820" height="200" fill="none" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Front Wing Gradients -->
    <linearGradient id="gs-full-wf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEA00" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>

    <!-- Front Stem Gradients -->
    <linearGradient id="gs-full-sf" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FB8C00" />
      <stop offset="55%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <!-- Rear Wing Gradients -->
    <linearGradient id="gs-full-wb" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="35%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FB8C00" />
    </linearGradient>

    <!-- Rear Stem Gradients -->
    <linearGradient id="gs-full-sb" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="55%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <!-- Text Gradient matching Logo Mark -->
    <linearGradient id="gs-full-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="40%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
  </defs>

  <!-- Flight Mark -->
  <g id="flight-mark">
    <!-- Rear Chevron Unit -->
    <path d="M 189 11 C 145.3 24.9, 77.7 15.0, 62 67 C 89.0 65.7, 118.7 56.0, 147 52 Z" fill="url(#gs-full-wb)" />
    <path d="M 189 11 L 147 52 C 145.6 80.5, 135.4 109.0, 132 138 C 186.3 122.4, 175.4 54.6, 189 11 Z" fill="url(#gs-full-sb)" />

    <!-- Front Chevron Unit -->
    <path d="M 137 63 C 93.3 76.9, 25.7 67.0, 10 119 C 37.0 117.7, 66.7 108.0, 95 104 Z" fill="url(#gs-full-wf)" />
    <path d="M 137 63 L 95 104 C 93.6 132.5, 83.4 161.0, 80 190 C 134.3 174.4, 123.4 106.6, 137 63 Z" fill="url(#gs-full-sf)" />
  </g>

  <!-- Integrated Logo Text: "GeoSphere 360°" -->
  <g transform="translate(220, 108)">
    <text y="0" dominant-baseline="central" alignment-baseline="central" font-family="system-ui, -apple-system, 'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="78" letter-spacing="-1">
      <tspan fill="url(#gs-full-text)">GeoSphere</tspan>
      <tspan font-weight="700" font-size="70" dx="14" fill="#FFFFFF">360°</tspan>
    </text>
  </g>
</svg>